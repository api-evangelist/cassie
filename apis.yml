name: Cassie
description: Cassie (Aircassie) develops advanced air filtration technology for healthcare
  and indoor environments. Its flagship CASSIE system uses patented filtration to eliminate
  mold, viruses, and bacteria with zero harmful emissions, contrasting with UV and ionizer
  systems that emit ozone. The company markets 99.9% effectiveness against viruses and
  bacteria, a 59-second disinfection cycle, and 24-hour air quality monitoring with
  real-time data. Cassie is a hardware and environmental-technology company backed by
  Techstars; it was added to the API Evangelist network as a portfolio lead. As of this
  enrichment pass it publishes a marketing website (Wix) with no public API, developer
  documentation, SDKs, or other machine-readable API artifacts.
